    # ----------------- Diodes ----------------- #
    diode:
      what: ceoloide/diode_tht_sod123
      where:
        - /matrix/
        - /thumb_(in|out)/
      adjust:
        rotate: diode_matrix_rotate
        shift: [-diode_shift_x, diode_shift_y]
      params:
        from: "{{colrow}}"
        to: "{{row_net}}"
        side: "B"
        reversible: false
        include_tht: false
    key_diode_colrow_route: &diode_route
      what: ceoloide/utility_router
      where: [key]
      params:
        net: "{{colrow}}"
        routes: [
            # Hotswap diaganol to stabilizer hole
            "b(-8.275, 3.75)(-6.421, 1.875)",
            # Horizontal line above stabilizer hole
            "b(-6.421, 1.875)(-4.0, 1.875)",
            "b(-4.0, 1.875)(-3.0, 0.875)",
            "b(-3.0, 0.875)(-3.0, -1.75)",
            "b(-3.0, -1.75)(-1.5, -3.5)",
          ]
    diode_via_row_net_route:
      <<: *diode_route
      params:
        net: "{{row_net}}"
        route: "b(1.5, -3.5)(2.75, -3.5)v"
    diode_via_colrow_route:
      <<: *diode_route
      params:
        net: "{{colrow}}"
        route: "b(-1.5, -3.5)(-2.75, -3.5)v"

    # -------------- Trace Routes -------------- #

    # ------------- M2 Screw Holes ------------- #
    holes_mount:
      what: ceoloide/mounting_hole_plated
      where: [hole]
      #include_courtyard: false

    # ------------ Key Trace Routes ------------ #

# ---------------------------------------------- #
#                     CASES                      #
# ---------------------------------------------- #
cases:
  switchplate:
    - name: switchplate
      extrude: 1

  _bottom:
    - name: panel
      extrude: 1
  _bottom_dp:
    - name: panel_dp
      extrude: 1
  _bottom_tp:
    - name: panel_tp
      extrude: 1

  _inner_wall_case:
    - name: panel
      extrude: 6
  _outer_wall_case:
    - name: panel_dp
      extrude: 6
  _wall_case:
    - what: case
      name: _outer_wall_case
      operation: add
    - what: case
      name: _inner_wall_case
      operation: subtract

  case:
    - what: case
      name: _bottom_dp
    - what: case
      name: _wall_case
      operation: add

  _inner_wall_cover:
    - name: panel_dp
      extrude: 8
  _outer_wall_cover:
    - name: panel_tp
      extrude: 8
  _wall_cover:
    - what: case
      name: _outer_wall_cover
      operation: add
    - what: case
      name: _inner_wall_cover
      operation: subtract
  cover:
    - what: case
      name: _bottom_tp
    - what: case
      name: _wall_cover
      operation: add
